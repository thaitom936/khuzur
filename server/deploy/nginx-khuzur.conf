# Install as /etc/nginx/conf.d/khuzur.conf on the sichuan server.
server {
    listen 80;
    server_name kzur.sdg8888.com;

    location / {
        return 301 https://kzur.sdg8888.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kzur.sdg8888.com;

    ssl_certificate /etc/letsencrypt/live/kzur.sdg8888.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kzur.sdg8888.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/khuzur.access.log;
    error_log /var/log/nginx/khuzur.error.log;

    location = /ws {
        proxy_pass http://127.0.0.1:9601;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location = / {
        default_type text/plain;
        return 200 "Khuzur game server\nWebSocket: wss://kzur.sdg8888.com/ws\n";
    }

    location / {
        return 404;
    }
}
